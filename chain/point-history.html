<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KMN 點數紀錄查詢</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#262b36; --ink:#e5e7eb; --mut:#8b93a1;
          --pri:#3ddc97; --pri2:#0f6e56; --warn:#f5a623; --danger:#ef5350; --in:#5ac8fa; --out:#ff9f68;
          --mono:ui-monospace,Menlo,Consolas,monospace; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Barlow Condensed",system-ui,"Noto Sans TC",sans-serif;
         background:var(--bg); color:var(--ink); line-height:1.55; }
  .wrap { max-width:820px; margin:0 auto; padding:26px 16px 60px; }
  h1 { font-size:26px; margin:0 0 2px; letter-spacing:.5px; }
  .sub { color:var(--mut); font-size:14px; margin-bottom:18px; }
  .status-line { display:flex; gap:14px; font-size:13px; color:var(--mut); margin-bottom:16px; flex-wrap:wrap; }
  .status-line b { color:var(--ink); font-family:var(--mono); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--danger); margin-right:4px; }
  .dot.on { background:var(--pri); }
  .row { display:flex; gap:8px; margin-bottom:16px; }
  input { flex:1; font-family:var(--mono); font-size:15px; padding:12px 14px;
          background:#0c0e12; border:1px solid var(--line); border-radius:8px; color:var(--ink); }
  input:focus { outline:none; border-color:var(--pri2); }
  button { font:inherit; font-size:15px; font-weight:600; border:0; border-radius:8px; padding:12px 22px;
           background:var(--pri); color:#06231a; cursor:pointer; letter-spacing:.5px; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .cards { display:flex; gap:14px; margin-bottom:20px; flex-wrap:wrap; }
  .stat { flex:1; min-width:130px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
  .stat .label { color:var(--mut); font-size:13px; margin-bottom:5px; }
  .stat .num { font-size:30px; font-family:var(--mono); line-height:1; }
  .stat.bal .num { color:var(--pri); } .stat.in .num { color:var(--in); } .stat.out .num { color:var(--out); }
  .prog { font-size:12px; color:var(--mut); margin-bottom:12px; display:none; }
  .prog.show { display:block; }
  table { width:100%; border-collapse:collapse; font-size:13px; display:none; }
  table.show { display:table; }
  th { text-align:left; color:var(--mut); font-weight:600; padding:9px 10px; border-bottom:1px solid var(--line);
       font-size:12px; text-transform:uppercase; letter-spacing:.5px; }
  td { padding:10px; border-bottom:1px solid var(--line); font-family:var(--mono); vertical-align:top; }
  tr:hover td { background:rgba(255,255,255,.02); }
  .type { font-size:11px; font-weight:700; padding:2px 8px; border-radius:4px; }
  .type.mint { background:rgba(61,220,151,.15); color:var(--pri); }
  .type.burn { background:rgba(255,159,104,.15); color:var(--out); }
  .type.xfer-in { background:rgba(90,200,250,.15); color:var(--in); }
  .type.xfer-out { background:rgba(139,147,161,.15); color:var(--mut); }
  .amt { text-align:right; font-weight:600; }
  .amt.plus { color:var(--pri); } .amt.minus { color:var(--out); }
  .msg { color:var(--mut); text-align:center; padding:26px; display:none; }
  .msg.show { display:block; }
  .err { color:var(--danger); }
  .counter { color:var(--mut); font-family:system-ui,sans-serif; }
</style>
</head>
<body>
<div class="wrap">
  <h1>點數紀錄查詢</h1>
  <div class="sub">查詢某帳號的點數發放與消耗紀錄 · 唯讀、不需私鑰 · Chain ID 88860</div>

  <div class="status-line">
    <span><span class="dot" id="dot"></span><span id="conn">連線中…</span></span>
    <span>高度 <b id="height">—</b></span>
  </div>

  <div class="row">
    <input id="addr" placeholder="0x 帳號地址…" spellcheck="false" autocomplete="off">
    <button id="btn">查詢</button>
  </div>

  <div class="prog" id="prog"></div>

  <div class="cards" id="cards" style="display:none;">
    <div class="stat bal"><div class="label">目前餘額</div><div><span class="num" id="s-bal">—</span></div></div>
    <div class="stat in"><div class="label">累計取得</div><div><span class="num" id="s-in">—</span></div></div>
    <div class="stat out"><div class="label">累計使用</div><div><span class="num" id="s-out">—</span></div></div>
  </div>

  <div class="msg" id="msg"></div>

  <table id="tbl">
    <thead><tr>
      <th>類型</th><th class="amt">點數</th><th>對象</th><th>區塊</th><th>時間</th><th>交易</th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
(function () {
  // ====== 設定：填入 NotaryPoint 合約地址 ======
  var RPC = "https://chain.kmn.tw";
  var NOTARY_POINT = "0x51fBA29ABFC827cb04e4a128aCb3d186c31Bef79";
  // 掃描起始區塊：填合約部署的區塊號可加速（不確定就填 0）
  var START_BLOCK = 0;
  var CHUNK = 5000; // 分段查詢，每段區塊數（避免單次範圍過大）
  // ============================================

  var ABI = [
    "function balanceOf(address) view returns (uint256)",
    "event Transfer(address indexed from, address indexed to, uint256 value)"
  ];
  var ZERO = "0x0000000000000000000000000000000000000000";

  var $ = function (id) { return document.getElementById(id); };
  var provider;

  if (typeof ethers === "undefined") { $("conn").textContent = "ethers 載入失敗"; return; }
  provider = new ethers.JsonRpcProvider(RPC);

  function health() {
    provider.getBlockNumber().then(function (n) {
      $("dot").classList.add("on"); $("conn").textContent = "已連線"; $("height").textContent = "#" + n;
    }).catch(function () { $("dot").classList.remove("on"); $("conn").textContent = "無法連線"; });
  }
  health(); setInterval(health, 8000);

  function short(a) { return a.slice(0, 10) + "…" + a.slice(-6); }

  // 分段查詢事件（避免一次掃太多塊）
  async function queryChunked(contract, filter, fromBlock, toBlock, onProgress) {
    var all = [];
    for (var start = fromBlock; start <= toBlock; start += CHUNK) {
      var end = Math.min(start + CHUNK - 1, toBlock);
      var logs = await contract.queryFilter(filter, start, end);
      all = all.concat(logs);
      if (onProgress) onProgress(end, toBlock);
    }
    return all;
  }

  async function query() {
    var addr = $("addr").value.trim();
    $("msg").className = "msg"; $("tbl").className = ""; $("cards").style.display = "none"; $("tbody").innerHTML = "";
    if (!/^0x[0-9a-fA-F]{40}$/.test(addr)) {
      $("msg").className = "msg show err"; $("msg").textContent = "地址格式不正確 (需 0x + 40 位)"; return;
    }
    $("btn").disabled = true;
    $("prog").className = "prog show"; $("prog").textContent = "掃描鏈上紀錄中…";
    try {
      var pt = new ethers.Contract(NOTARY_POINT, ABI, provider);
      var head = await provider.getBlockNumber();

      // 分別查「轉入」(to=addr) 與「轉出」(from=addr)
      var inLogs = await queryChunked(pt, pt.filters.Transfer(null, addr), START_BLOCK, head, function (cur, total) {
        $("prog").textContent = "掃描取得紀錄… 區塊 " + cur + " / " + total;
      });
      var outLogs = await queryChunked(pt, pt.filters.Transfer(addr, null), START_BLOCK, head, function (cur, total) {
        $("prog").textContent = "掃描使用紀錄… 區塊 " + cur + " / " + total;
      });
      $("prog").className = "prog";

      // 合併、依區塊排序（新到舊）
      var events = [];
      inLogs.forEach(function (l) { events.push({ log: l, dir: "in" }); });
      outLogs.forEach(function (l) { events.push({ log: l, dir: "out" }); });
      events.sort(function (a, b) {
        if (b.log.blockNumber !== a.log.blockNumber) return b.log.blockNumber - a.log.blockNumber;
        return (b.log.index || 0) - (a.log.index || 0);
      });

      var bal = await pt.balanceOf(addr);
      var totalIn = 0n, totalOut = 0n;

      var tb = $("tbody");
      // 需要區塊時間，快取避免重複查
      var blockTimeCache = {};
      async function blockTime(bn) {
        if (blockTimeCache[bn] !== undefined) return blockTimeCache[bn];
        var b = await provider.getBlock(bn);
        blockTimeCache[bn] = b ? b.timestamp : 0;
        return blockTimeCache[bn];
      }

      for (var i = 0; i < events.length; i++) {
        var e = events[i], l = e.log, v = l.args.value;
        var from = l.args.from, to = l.args.to, type, cls, counter, sign, amtCls;
        if (from === ZERO) { type = "發放"; cls = "mint"; counter = "(系統發放)"; sign = "+"; amtCls = "plus"; totalIn += v; }
        else if (to === ZERO) { type = "使用"; cls = "burn"; counter = "(存證消耗)"; sign = "−"; amtCls = "minus"; totalOut += v; }
        else if (e.dir === "in") { type = "轉入"; cls = "xfer-in"; counter = short(from); sign = "+"; amtCls = "plus"; totalIn += v; }
        else { type = "轉出"; cls = "xfer-out"; counter = short(to); sign = "−"; amtCls = "minus"; totalOut += v; }

        var ts = await blockTime(l.blockNumber);
        var time = ts ? new Date(ts * 1000).toLocaleString("zh-TW", { hour12: false }) : "—";
        var h = l.transactionHash;

        var tr = document.createElement("tr");
        tr.innerHTML =
          '<td><span class="type ' + cls + '">' + type + '</span></td>' +
          '<td class="amt ' + amtCls + '">' + sign + v.toString() + '</td>' +
          '<td class="counter">' + counter + '</td>' +
          '<td>#' + l.blockNumber + '</td>' +
          '<td style="font-size:12px">' + time + '</td>' +
          '<td><a href="#" style="color:var(--mut);text-decoration:none" title="' + h + '" onclick="navigator.clipboard.writeText(\'' + h + '\');this.textContent=\'已複製\';return false;">' + h.slice(0, 10) + '…</a></td>';
        tb.appendChild(tr);
      }

      $("s-bal").textContent = bal.toString();
      $("s-in").textContent = totalIn.toString();
      $("s-out").textContent = totalOut.toString();
      $("cards").style.display = "flex";

      if (events.length === 0) {
        $("msg").className = "msg show"; $("msg").textContent = "此帳號沒有任何點數紀錄";
      } else {
        $("tbl").className = "show";
      }
    } catch (e) {
      $("prog").className = "prog";
      $("msg").className = "msg show err"; $("msg").textContent = "查詢失敗：" + (e.shortMessage || e.message);
    } finally {
      $("btn").disabled = false;
    }
  }

  $("btn").addEventListener("click", query);
  $("addr").addEventListener("keydown", function (e) { if (e.key === "Enter") query(); });
})();
</script>
</body>
</html>
